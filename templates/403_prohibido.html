{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Denegado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;

            /* --- CONFIGURACIÓN DE IMAGEN --- */
            background-image: url("{% static 'img/403.png' %}");
            /* La imagen ocupa todo el espacio sin cortes */
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;

            /* --- ALINEACIÓN --- */
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Todo abajo */
            align-items: flex-end;     /* Todo a la DERECHA */
        }

        /* --- CUADRO DE MENSAJE TRANSPARENTE --- */
        .message-card {
            /* Fondo transparente y sin bordes */
            background: transparent;
            border: none;
            box-shadow: none;

            padding: 1rem;
            max-width: 450px;
            width: auto;

            text-align: right; /* Texto alineado a la derecha */

            /* Márgenes para separarlo de la esquina */
            margin-right: 3rem;
            margin-bottom: 3rem;

            /* Animación suave */
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Texto "ALTO AHÍ" */
        .message-card h1 {
            font-weight: 900;
            text-transform: uppercase;
            margin: 0 0 0.5rem 0;
            font-size: 2.5rem; /* Letra más grande y potente */
            letter-spacing: 1px;
            color: #ff3333; /* Rojo intenso */
            /* Sombra fuerte para que se lea bien sobre cualquier fondo */
            text-shadow: 3px 3px 6px rgba(0,0,0,0.9);
        }

        /* Párrafo explicativo */
        .message-card p {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            color: #ffffff;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
        }

        /* --- BOTÓN --- */
        .btn-regresar {
            background-color: #1e3a8a;
            color: white;
            padding: 12px 35px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            display: inline-flex;
            align-items: center;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .btn-regresar:hover {
            background-color: #d1a928;
            color: white;
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(209, 169, 40, 0.7);
            border-color: #ffffff;
        }

        /* --- RESPONSIVO --- */
        @media (max-width: 768px) {
            body {
                align-items: center; /* En celular lo centramos */
                background-size: cover; /* 'cover' se ve mejor en vertical */
            }
            .message-card {
                text-align: center;
                margin-right: 0;
                margin-bottom: 2rem;
            }
        }
    </style>
</head>
<body>

    <div class="message-card">
        <h1><i class="bi bi-hand-index-thumb-fill me-2"></i>¡ALTO AHÍ!</h1>
        <p>No tienes los permisos necesarios para estar aquí.</p>

        <a href="{% url 'root' %}" class="btn-regresar">
            <i class="bi bi-arrow-left-circle me-2"></i> Regresar
        </a>
    </div>

</body>
</html>
