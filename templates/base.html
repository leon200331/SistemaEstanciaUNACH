{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Estancia Infantil UNACH{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        /* =========================================================
           ALERTAS PERSONALIZADAS DEL SISTEMA
           Reemplazan la sensación de alerta gris genérica.
           ========================================================= */
        .swal2-toast.sistema-toast {
            border-radius: 18px !important;
            padding: 14px 16px !important;
            box-shadow: 0 16px 38px rgba(15, 23, 42, .18) !important;
            border: 1px solid rgba(226, 232, 240, .95) !important;
        }

        .swal2-toast.sistema-toast .swal2-title {
            font-size: .92rem !important;
            font-weight: 800 !important;
            line-height: 1.35 !important;
            color: #0f172a !important;
        }

        .swal2-toast.sistema-toast .swal2-icon {
            margin: 0 .65rem 0 0 !important;
        }

        .swal2-timer-progress-bar {
            background: rgba(37, 99, 235, .45) !important;
        }

        .sistema-toast-success {
            border-left: 7px solid #16a34a !important;
            background: #f0fdf4 !important;
        }

        .sistema-toast-error {
            border-left: 7px solid #dc2626 !important;
            background: #fef2f2 !important;
        }

        .sistema-toast-warning {
            border-left: 7px solid #f59e0b !important;
            background: #fffbeb !important;
        }

        .sistema-toast-info {
            border-left: 7px solid #2563eb !important;
            background: #eff6ff !important;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>

    {% block content %}
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    {% if user.is_authenticated %}
    <script>
        // TIEMPO DE INACTIVIDAD: 30 minutos
        const inactivityTime = 1800000;
        let inactivityTimer;

        function resetTimer() {
            clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(logoutByInactivity, inactivityTime);
        }

        function logoutByInactivity() {
            window.location.href = "{% url 'logout' %}";
        }

        window.addEventListener("load", resetTimer);
        document.addEventListener("mousemove", resetTimer);
        document.addEventListener("keypress", resetTimer);
        document.addEventListener("click", resetTimer);
        document.addEventListener("scroll", resetTimer);
    </script>
    {% endif %}

    {% if messages %}
    <script>
        document.addEventListener("DOMContentLoaded", async function() {
            const mensajesSistema = [
                {% for message in messages %}
                {
                    texto: "{{ message|escapejs }}",
                    tags: "{{ message.tags|default:'info'|escapejs }}"
                },
                {% endfor %}
            ];

            function obtenerIcono(tags) {
                tags = (tags || "").toLowerCase();

                if (tags.includes("success")) return "success";
                if (tags.includes("error") || tags.includes("danger")) return "error";
                if (tags.includes("warning")) return "warning";

                return "info";
            }

            function obtenerClase(icono) {
                if (icono === "success") return "sistema-toast-success";
                if (icono === "error") return "sistema-toast-error";
                if (icono === "warning") return "sistema-toast-warning";
                return "sistema-toast-info";
            }

            const Toast = Swal.mixin({
                toast: true,
                position: "top-end",
                showConfirmButton: false,
                timer: 4300,
                timerProgressBar: true,
                customClass: {
                    popup: "sistema-toast"
                },
                didOpen: (toast) => {
                    toast.addEventListener("mouseenter", Swal.stopTimer);
                    toast.addEventListener("mouseleave", Swal.resumeTimer);
                }
            });

            for (const mensaje of mensajesSistema) {
                const icono = obtenerIcono(mensaje.tags);

                await Toast.fire({
                    icon: icono,
                    title: mensaje.texto,
                    customClass: {
                        popup: `sistema-toast ${obtenerClase(icono)}`
                    }
                });
            }
        });
    </script>
    {% endif %}

    {% block extra_js %}{% endblock %}

</body>
</html>
