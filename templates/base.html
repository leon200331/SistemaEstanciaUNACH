{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Estancia Infantil UNACH{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    {% block extra_css %}{% endblock %}
</head>
<body>

    {% block content %}
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    {% if user.is_authenticated %}
    <script>
        // ⏳ TIEMPO DE INACTIVIDAD (30 MINUTOS)
        const inactivityTime = 1800000;

        let time;

        function resetTimer() {
            clearTimeout(time);
            time = setTimeout(logout, inactivityTime);
        }

        function logout() {
            // Redirige al logout real de Django
            window.location.href = "{% url 'logout' %}";
        }

        // Eventos que reinician actividad
        window.onload = resetTimer;
        document.onmousemove = resetTimer;
        document.onkeypress = resetTimer;
        document.onclick = resetTimer;
        document.onscroll = resetTimer;
    </script>
    {% endif %}

    {% block extra_js %}{% endblock %}

</body>
</html>
