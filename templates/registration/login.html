{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Estancia Infantil UNACH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        /* --- CONFIGURACIÓN GENERAL Y FONDO --- */
        body {
            /* Fondo con capa oscura al 60% para que se lean los textos */
            background: linear-gradient(rgba(0, 32, 66, 0.6), rgba(0, 32, 66, 0.6)),
                        url("{% static 'img/fondo.png' %}");
            background-size: cover;
            background-position: center;
            height: 100vh;

            /* --- ALINEACIÓN A LA IZQUIERDA --- */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding-left: 8%;

            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        /* --- LOGO SUPERIOR IZQUIERDO --- */
        .main-logo {
            width: 280px;
            height: auto;
            margin-bottom: 2rem;
        }

        /* --- TARJETA DE LOGIN (CRISTAL) --- */
        .login-card {
            width: 100%;
            max-width: 380px;
            padding: 2.5rem 2rem;
            border-radius: 12px;

            /* Efecto Vidrio */
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* INPUTS */
        .form-control {
            background: rgba(255, 255, 255, 0.9);
            border: none;
            padding: 12px;
            font-size: 0.95rem;
        }
        .form-control:focus {
            background: #fff;
            box-shadow: none; /* Quitamos sombra externa para que se vea limpio */
            border-color: transparent;
        }

        /* Estilo para los iconos (izq y der) para que coincidan con el input */
        .input-group-text, .btn-ojito {
            background: rgba(255, 255, 255, 0.9);
            border: none;
            color: #555;
        }

        /* Ajuste específico para el botón del ojito */
        .btn-ojito:hover {
            background: #fff;
            color: #1e3a8a;
        }

        /* BOTÓN INGRESAR */
        .btn-ingresar {
            background-color: #1e3a8a; /* Azul Institucional */
            color: white; font-weight: 700; padding: 12px;
            border-radius: 6px; border: none; width: 100%; margin-top: 10px;
            transition: all 0.2s;
        }
        .btn-ingresar:hover {
            background-color: #d1a928; /* Dorado al pasar mouse */
            transform: translateY(-2px); color: white;
        }

        /* TEXTOS */
        .form-check-label { color: rgba(255,255,255,0.95); font-size: 0.9rem; }

        /* RESPONSIVO */
        @media (max-width: 768px) {
            body {
                align-items: center;
                padding-left: 0;
            }
            .main-logo { width: 220px; }
            .login-card { width: 90%; }
        }

        /* Ajustes para SweetAlert */
        .swal2-popup {
            border-radius: 16px !important;
        }
        .swal2-confirm {
            border-radius: 8px !important;
            font-weight: bold !important;
        }
    </style>
</head>
<body>

    <img src="{% static 'img/logo.png' %}" alt="Logo Estancia UNACH" class="main-logo">

    <div class="login-card">
        <form method="post">
            {% csrf_token %}

            <h5 class="text-center text-white mb-4" style="font-weight: 600; letter-spacing: 0.5px;">Acceso Institucional</h5>

            {% if form.errors %}
                <div class="alert alert-danger py-2 mb-3" style="font-size: 0.9rem;">
                    <i class="bi bi-exclamation-circle-fill me-2"></i>Credenciales incorrectas
                </div>
            {% endif %}

            <div class="mb-3 input-group">
                <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                <input type="email" name="username" class="form-control" placeholder="Correo institucional (@unach.mx)" pattern=".*@unach\.mx$" title="Debe ser un correo con terminación @unach.mx" required>
            </div>

            <div class="mb-3 input-group">
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                <input type="password" name="password" class="form-control" placeholder="Contraseña" required id="id_password">
                <button class="btn btn-ojito" type="button" id="togglePassword">
                    <i class="bi bi-eye-fill"></i>
                </button>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe">
                <label class="form-check-label" for="rememberMe">Recuérdame</label>
            </div>

            <button type="submit" class="btn btn-ingresar">INICIAR SESIÓN</button>

            <div class="text-center mt-4">
                <a href="#" id="btnNuevoIngreso" style="color: rgba(255,255,255,0.9); font-size: 0.85rem; text-decoration: underline; transition: color 0.2s;">
                    ¿Eres nuevo/a en la Estancia Infantil?
                </a>
            </div>
        </form>
    </div>

    <script>
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#id_password');
        const icon = togglePassword.querySelector('i');

        togglePassword.addEventListener('click', function (e) {
            // 1. Cambiar el tipo de atributo (password <-> text)
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);

            // 2. Cambiar el ícono (Ojo lleno <-> Ojo tachado)
            icon.classList.toggle('bi-eye-fill');
            icon.classList.toggle('bi-eye-slash-fill');
        });

        // 3. Lógica de SweetAlert para el botón de "Nuevo Ingreso"
        document.getElementById('btnNuevoIngreso').addEventListener('click', function(e) {
            e.preventDefault();
            Swal.fire({
              title: '<strong style="color:#1e3a8a;">Bienvenido/a a la Estancia</strong>',
              icon: 'info',
              html: `
                <div style="text-align: left; font-size: 0.95rem; line-height: 1.6; color:#333; margin-top: 10px;">
                  <p>Si eres estudiante o trabajador de la UNACH y deseas inscribir a tu menor por primera vez, sigue estos pasos:</p>
                  <ul style="list-style-type: none; padding-left: 0; margin-top: 15px;">
                    <li style="margin-bottom: 12px; background: #f8f9fa; padding: 10px; border-radius: 8px; border-left: 4px solid #1e3a8a;">
                      🏢 <b>1. Acude a Trabajo Social:</b> Ve a las instalaciones para solicitar tu registro inicial.
                    </li>
                    <li style="margin-bottom: 12px; background: #f8f9fa; padding: 10px; border-radius: 8px; border-left: 4px solid #1e3a8a;">
                      📧 <b>2. Recibe tu enlace:</b> Te enviaremos un link único a tu correo institucional (@unach.mx).
                    </li>
                    <li style="margin-bottom: 12px; background: #f8f9fa; padding: 10px; border-radius: 8px; border-left: 4px solid #1e3a8a;">
                      📝 <b>3. Llena tu solicitud:</b> Usa el enlace para capturar los datos del menor y los tuyos.
                    </li>
                    <li style="background: #f8f9fa; padding: 10px; border-radius: 8px; border-left: 4px solid #198754;">
                      ✅ <b>4. Espera tu acceso:</b> Al aprobar tu solicitud, te daremos tu contraseña para iniciar sesión aquí.
                    </li>
                  </ul>
                </div>
              `,
              confirmButtonText: '¡Entendido!',
              confirmButtonColor: '#1e3a8a',
              background: '#ffffff',
              width: '500px'
            });
        });
    </script>

</body>
</html>
