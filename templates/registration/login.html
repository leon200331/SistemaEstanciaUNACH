{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Estancia Infantil UNACH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <style>
        /* --- CONFIGURACIÓN GENERAL Y FONDO --- */
        body {
            /* Fondo con capa oscura al 60% para que se lean los textos */
            background: linear-gradient(rgba(0, 32, 66, 0.6), rgba(0, 32, 66, 0.6)),
                        url("{% static 'img/fondo.png' %}");
            background-size: cover;
            background-position: center;
            height: 100vh;

            /* --- ALINEACIÓN A LA IZQUIERDA --- */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding-left: 8%;

            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        /* --- LOGO SUPERIOR IZQUIERDO --- */
        .main-logo {
            width: 280px;
            height: auto;
            margin-bottom: 2rem;
        }

        /* --- TARJETA DE LOGIN (CRISTAL) --- */
        .login-card {
            width: 100%;
            max-width: 380px;
            padding: 2.5rem 2rem;
            border-radius: 12px;

            /* Efecto Vidrio */
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* INPUTS */
        .form-control {
            background: rgba(255, 255, 255, 0.9);
            border: none;
            padding: 12px;
            font-size: 0.95rem;
        }
        .form-control:focus {
            background: #fff;
            box-shadow: none; /* Quitamos sombra externa para que se vea limpio */
            border-color: transparent;
        }

        /* Estilo para los iconos (izq y der) para que coincidan con el input */
        .input-group-text, .btn-ojito {
            background: rgba(255, 255, 255, 0.9);
            border: none;
            color: #555;
        }

        /* Ajuste específico para el botón del ojito */
        .btn-ojito:hover {
            background: #fff;
            color: #1e3a8a;
        }

        /* BOTÓN INGRESAR */
        .btn-ingresar {
            background-color: #1e3a8a; /* Azul Institucional */
            color: white; font-weight: 700; padding: 12px;
            border-radius: 6px; border: none; width: 100%; margin-top: 10px;
            transition: all 0.2s;
        }
        .btn-ingresar:hover {
            background-color: #d1a928; /* Dorado al pasar mouse */
            transform: translateY(-2px); color: white;
        }

        /* TEXTOS */
        .form-check-label { color: rgba(255,255,255,0.95); font-size: 0.9rem; }
        .forgot-link {
            color: rgba(255,255,255,0.8); text-decoration: none; font-size: 0.85rem; margin-top: 1rem; display: inline-block;
        }
        .forgot-link:hover { color: #fff; text-decoration: underline; }

        /* RESPONSIVO */
        @media (max-width: 768px) {
            body {
                align-items: center;
                padding-left: 0;
            }
            .main-logo { width: 220px; }
            .login-card { width: 90%; }
        }
    </style>
</head>
<body>

    <img src="{% static 'img/logo.png' %}" alt="Logo Estancia UNACH" class="main-logo">

    <div class="login-card">
        <form method="post">
            {% csrf_token %}

            {% if form.errors %}
                <div class="alert alert-danger py-2 mb-3" style="font-size: 0.9rem;">
                    <i class="bi bi-exclamation-circle-fill me-2"></i>Credenciales incorrectas
                </div>
            {% endif %}

            <div class="mb-3 input-group">
                <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                <input type="text" name="username" class="form-control" placeholder="Usuario" required>
            </div>

            <div class="mb-3 input-group">
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                <input type="password" name="password" class="form-control" placeholder="Contraseña" required id="id_password">
                <button class="btn btn-ojito" type="button" id="togglePassword">
                    <i class="bi bi-eye-fill"></i>
                </button>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe">
                <label class="form-check-label" for="rememberMe">Recuérdame</label>
            </div>

            <button type="submit" class="btn btn-ingresar">INICIAR SESIÓN</button>

            <div class="text-center">
                <a href="{% url 'password_reset' %}" class="forgot-link">¿Olvidaste tu contraseña?</a>
            </div>
        </form>
    </div>

    <script>
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#id_password');
        const icon = togglePassword.querySelector('i');

        togglePassword.addEventListener('click', function (e) {
            // 1. Cambiar el tipo de atributo (password <-> text)
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);

            // 2. Cambiar el ícono (Ojo lleno <-> Ojo tachado)
            icon.classList.toggle('bi-eye-fill');
            icon.classList.toggle('bi-eye-slash-fill');
        });
    </script>

</body>
</html>
