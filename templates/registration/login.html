{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Estancia Infantil UNACH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <style>
        /* --- CONFIGURACIÓN GENERAL Y FONDO --- */
        body {
            /* Fondo con capa oscura al 60% para que se lean los textos */
            background: linear-gradient(rgba(0, 32, 66, 0.6), rgba(0, 32, 66, 0.6)),
                        url("{% static 'img/fondo.png' %}"); /* <--- OJO: .png */
            background-size: cover;
            background-position: center;
            height: 100vh;

            /* --- ALINEACIÓN A LA IZQUIERDA --- */
            display: flex;
            flex-direction: column; /* Uno debajo del otro */
            justify-content: center; /* Centrados verticalmente */
            align-items: flex-start; /* Alineados a la IZQUIERDA */
            padding-left: 8%; /* Espacio desde el borde izquierdo */

            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        /* --- LOGO SUPERIOR IZQUIERDO --- */
        .main-logo {
            width: 280px; /* Tamaño ajustado para la izquierda */
            height: auto;
            margin-bottom: 2rem; /* Espacio debajo del logo */
            /* Si el PNG tiene fondo blanco y quieres que se mezcle un poco: */
            /* mix-blend-mode: screen; */
        }

        /* --- TARJETA DE LOGIN (CRISTAL) --- */
        .login-card {
            width: 100%;
            max-width: 380px; /* Tarjeta compacta */
            padding: 2.5rem 2rem;
            border-radius: 12px;

            /* Efecto Vidrio */
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* INPUTS */
        .form-control {
            background: rgba(255, 255, 255, 0.9);
            border: none;
            padding: 12px;
            font-size: 0.95rem;
        }
        .form-control:focus {
            background: #fff;
            box-shadow: 0 0 0 3px rgba(209, 169, 40, 0.5); /* Dorado UNACH */
        }
        .input-group-text {
            background: rgba(255, 255, 255, 0.9); border: none; color: #555;
        }

        /* BOTÓN */
        .btn-ingresar {
            background-color: #1e3a8a; /* Azul Institucional */
            color: white; font-weight: 700; padding: 12px;
            border-radius: 6px; border: none; width: 100%; margin-top: 10px;
            transition: all 0.2s;
        }
        .btn-ingresar:hover {
            background-color: #d1a928; /* Dorado al pasar mouse */
            transform: translateY(-2px); color: white;
        }

        /* TEXTOS */
        .form-check-label { color: rgba(255,255,255,0.95); font-size: 0.9rem; }
        .forgot-link {
            color: rgba(255,255,255,0.8); text-decoration: none; font-size: 0.85rem; margin-top: 1rem; display: inline-block;
        }
        .forgot-link:hover { color: #fff; text-decoration: underline; }

        /* RESPONSIVO (Celulares) */
        @media (max-width: 768px) {
            body {
                align-items: center; /* En celular sí centramos todo */
                padding-left: 0;
            }
            .main-logo { width: 220px; }
            .login-card { width: 90%; }
        }
    </style>
</head>
<body>

    <img src="{% static 'img/logo.png' %}" alt="Logo Estancia UNACH" class="main-logo">

    <div class="login-card">
        <form method="post">
            {% csrf_token %}
            {% if form.errors %}
                <div class="alert alert-danger py-2 mb-3" style="font-size: 0.9rem;">Credenciales incorrectas</div>
            {% endif %}
            <div class="mb-3 input-group">
                <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                <input type="text" name="username" class="form-control" placeholder="Usuario" required>
            </div>
            <div class="mb-3 input-group">
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                <input type="password" name="password" class="form-control" placeholder="Contraseña" required>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe">
                <label class="form-check-label" for="rememberMe">Recuérdame</label>
            </div>
            <button type="submit" class="btn btn-ingresar">INICIAR SESIÓN</button>
            <div class="text-center">
                <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
            </div>
        </form>
    </div>

</body>
</html>
