<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Solicitud enviada</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="card shadow-sm p-4">
      <h2 class="mb-3">¡Gracias!</h2>

      <p class="mb-1">Tu solicitud fue recibida correctamente.</p>
      <p class="mb-3"><strong>Folio:</strong> {{ folio }}</p>

      <div class="d-flex gap-2">
      <a class="btn btn-primary" href="{% url 'login' %}">
  Ir al inicio de sesión
</a>

        <a class="btn btn-outline-secondary" href="{% url 'logout' %}">
          Salir
        </a>
      </div>

      <hr class="my-4">
      <p class="text-muted mb-0" style="font-size: 0.9rem;">
        Nota: Este enlace de captura es de un solo uso. Si necesitas corregir datos, solicita un nuevo enlace en coordinación.
      </p>
    </div>
  </div>
</body>
</html>
