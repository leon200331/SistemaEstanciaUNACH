{% extends "base.html" %}

{% block title %}Nuevo ingreso{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="card p-4 shadow-sm">
    <h2 class="fw-bold">Nuevo ingreso</h2>
    <p class="text-muted">
      Inicia tu solicitud de registro para la Estancia Infantil UNACH.
    </p>

    <form method="post">
      {% csrf_token %}
      <button class="btn btn-primary">
        Iniciar solicitud
      </button>
    </form>
  </div>
</div>
{% endblock %}
